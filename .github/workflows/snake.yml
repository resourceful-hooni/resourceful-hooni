name: contribution-snake

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3a5bc7&color_dots=#ebedf0,#d6def3,#aebbe6,#7189d6,#3a5bc7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8fa3e8&color_dots=#161b22,#1f2a4d,#2e4185,#4a63c2,#8fa3e8

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update contribution snake"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
