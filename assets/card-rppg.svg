<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" fill="none" role="img" aria-label="rPPG BP Estimation — Contactless blood-pressure estimation from camera video using remote photoplethysmography (rPPG) — built during a research internship at Yonsei HCI Lab."><title>rPPG BP Estimation — Contactless blood-pressure estimation from camera video using remote photoplethysmography (rPPG) — built during a research internship at Yonsei HCI Lab.</title><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{animation:ping 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.85;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.trace{animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:-400}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
