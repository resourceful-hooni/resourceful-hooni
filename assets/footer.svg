<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none" role="img" aria-label="Let's build machines that sense, decide and move."><title>Let's build machines that sense, decide and move.</title><style>@font-face{font-family:'Inter';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{animation:ping 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.85;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.trace{animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:-400}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6FB"/></linearGradient><clipPath id="clipf"><rect width="1200" height="210" rx="22"/></clipPath><pattern id="gridf" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#0F172A" stroke-opacity=".05"/></pattern><radialGradient id="gmf" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="maskf"><rect width="1200" height="210" fill="url(#gmf)"/></mask><radialGradient id="glowf" cx="600.0" cy="250" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2563EB" stop-opacity="0.14"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2" stop-opacity="0"/><stop offset=".5" stop-color="#0891B2" stop-opacity=".9"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></linearGradient><linearGradient id="fg" x1="214.133984375" y1="0" x2="985.866015625" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0B1220"/><stop offset=".6" stop-color="#1D4ED8"/><stop offset="1" stop-color="#0891B2"/></linearGradient></defs><g clip-path="url(#clipf)"><rect width="1200" height="210" fill="url(#bgf)"/><rect width="1200" height="210" fill="url(#gridf)" mask="url(#maskf)"/><rect width="1200" height="210" fill="url(#glowf)"/><rect x="-240" y="0" width="240" height="1.5" fill="url(#scan)"><animate attributeName="x" from="-240" to="1200" dur="5s" repeatCount="indefinite"/></rect><text x="600.0" y="104.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="url(#fg)" text-anchor="middle" letter-spacing="-0.8">Let's build machines that sense, decide &amp; move.</text><text x="600.0" y="146.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11.5" fill="#8A94A6" text-anchor="middle" letter-spacing="2.4">KIM JIHOON  ·  PHYSICAL AI CONTEXT ENGINEER  ·  KIMJIHOON.ME</text></g><rect x=".5" y=".5" width="1199" height="209" rx="21.5" stroke="#E2E8F0"/></svg>