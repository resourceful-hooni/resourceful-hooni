<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" fill="none" role="img" aria-label="Highlights"><title>Highlights</title><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{animation:ping 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.85;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.trace{animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:-400}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="tph0" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4E2"/><stop offset="1.0" stop-color="#FFFFFF"/></linearGradient><linearGradient id="tph1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEFF"/><stop offset="1.0" stop-color="#FFFFFF"/></linearGradient><linearGradient id="tph2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1.0" stop-color="#FFFFFF"/></linearGradient></defs><g class="rise" style="animation-delay:0.05s"><rect x="0.5" y=".5" width="384.3333333333333" height="179" rx="16" fill="url(#tph0)" stroke="#F5DFBB"/><text x="30.0" y="54.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11" fill="#D97706" letter-spacing="1.6">AWARD — 2026</text><text x="29.0" y="106.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#0B1220" letter-spacing="-1">National Winner</text><text x="30.0" y="140.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15" fill="#5B6678">James Dyson Award, Korea · REBOOT</text></g><g class="rise" style="animation-delay:0.15s"><rect x="407.8333333333333" y=".5" width="384.3333333333333" height="179" rx="16" fill="url(#tph1)" stroke="#E0D5FA"/><text x="437.3" y="54.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11" fill="#7C3AED" letter-spacing="1.6">PUBLICATION — 2026</text><text x="436.3" y="106.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#0B1220" letter-spacing="-1">ACM DIS '26</text><text x="437.3" y="140.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15" fill="#5B6678">Companion · co-first author</text></g><g class="rise" style="animation-delay:0.25s"><rect x="815.1666666666666" y=".5" width="384.3333333333333" height="179" rx="16" fill="url(#tph2)" stroke="#D6E2FB"/><text x="844.7" y="54.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11" fill="#2563EB" letter-spacing="1.6">COMPETITIONS — 2024–25</text><text x="843.7" y="106.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#0B1220" letter-spacing="-1">3× 2nd place</text><text x="844.7" y="140.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15" fill="#5B6678">Mobility · makerthon · hackathon</text></g></svg>