<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" fill="none" role="img" aria-label="Highlights"><title>Highlights</title><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Inter';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{animation:ping 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.85;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.trace{animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:-400}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs></defs><rect x=".5" y=".5" width="1199" height="175" rx="14" fill="#FFFFFF" stroke="#E3E7ED"/><g class="fade" style="animation-delay:0.05s"><text x="36.0" y="54.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11" fill="#8A94A6" letter-spacing="1.6">AWARD — 2026</text><text x="35.0" y="104.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#0B1220" letter-spacing="-1">National Winner</text><text x="36.0" y="136.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15" fill="#5B6678">James Dyson Award, Korea · REBOOT</text></g><line x1="400.0" y1="28" x2="400.0" y2="148" stroke="#EDF0F4"/><g class="fade" style="animation-delay:0.15s"><text x="436.0" y="54.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11" fill="#8A94A6" letter-spacing="1.6">PUBLICATION — 2026</text><text x="435.0" y="104.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#0B1220" letter-spacing="-1">ACM DIS '26</text><text x="436.0" y="136.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15" fill="#5B6678">Companion · co-first author</text></g><line x1="800.0" y1="28" x2="800.0" y2="148" stroke="#EDF0F4"/><g class="fade" style="animation-delay:0.25s"><text x="836.0" y="54.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="11" fill="#8A94A6" letter-spacing="1.6">COMPETITIONS — 2024–25</text><text x="835.0" y="104.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#0B1220" letter-spacing="-1">3× 2nd place</text><text x="836.0" y="136.0" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="400" font-size="15" fill="#5B6678">Mobility · makerthon ·