<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60" fill="none" role="img" aria-label="03 AWARDS &amp; RECOGNITION"><title>03 AWARDS &amp; RECOGNITION</title><style>@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{animation:ping 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.85;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
.flow{animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.trace{animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:-400}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs></defs><text x="2.0" y="36.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="12.5" fill="#3A5BC7" letter-spacing="2.4">03</text><text x="33.8" y="36.0" font-family="'JBM','SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="12.5" fill="#5B6678" letter-spacing="2.4">AWARDS &amp; RECOGNITION</text><line x1="245.8" y1="31.5" x2="1198.0" y2="31.5" stroke="#E3E7ED"/></svg>